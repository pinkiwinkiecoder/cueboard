name: Nachtelijke database-back-up

# Het gratis Supabase-plan maakt geen back-ups. Deze workflow maakt elke nacht
# een dump van de database en bewaart die 14 dagen als artefact in deze (privé!)
# repository. Bestanden (riders, call sheets) zitten er NIET in: gebruik daarvoor
# "Exporteer alles" (volgt later). Draait enkel in een privé-repository.
on:
  schedule:
    - cron: '41 2 * * *' # 02:41 UTC
  workflow_dispatch: {}

jobs:
  dump:
    # Back-ups bevatten persoonsgegevens: enkel in een privé-repository draaien.
    if: github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL ontbreekt (zie README stap 6)."
            exit 1
          fi
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --data-only --use-copy
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data-auth.sql --data-only --use-copy --schema auth
          ls -la backup
      - uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 14
          if-no-files-found: error
